<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<script>
/* 本地 / 桌面端适配器：页面找不到 window.claude 时使用。
   sample.json(prompt, opts) 必须返回解析好的 JSON；失败时 reject {code, message}。 */
window.BIDREAD_ADAPTER = {
  sample: {
    json: async (prompt, opts = {}) => {
      let r;
      try {
        r = await fetch('/api/bidread/llm', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, tier: opts.modelTier || 'default' }), signal: opts.signal });
      } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', message: String(e) }; }
      if (r.status === 429) throw { code: 'rate_limited', message: 'HTTP 429' };
      if (r.status === 413) throw { code: 'prompt_too_large', message: 'HTTP 413' };
      if (r.status === 451) throw { code: 'content_filtered', message: 'HTTP 451' };
      if (!r.ok) throw { code: 'upstream_error', message: 'HTTP ' + r.status };
      // 部分模型（如 MiniMax）偶尔把 null 写成 "null, 少一个引号，先修正再解析
      const text = (await r.text()).replace(/":"null,"/g, '":null,"').replace(/":"null}/g, '":null}');
      try { return JSON.parse(text); } catch (e) {}
      const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) { try { return JSON.parse(fence[1]); } catch (e) {} }
      const m = text.match(/[\[{][\s\S]*[\]}]/); if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
      throw { code: 'invalid_json', message: 'model output is not JSON', text };
    }
  },
  // 项目存储：dev_server.py 把每个项目存成 projects/<ID>/ 下的文件夹（原始文件 + 解读结果）
  projects: (() => {
    const B = '/api/bidread/projects', enc = encodeURIComponent;
    const req = async (method, url, body, raw) => {
      const r = await fetch(B + url, { method, headers: raw ? {} : { 'Content-Type': 'application/json' },
        body: raw ? body : body === undefined ? undefined : JSON.stringify(body) });
      if (!r.ok) { let msg = 'HTTP ' + r.status; try { msg = (await r.json()).error || msg; } catch (e) {} throw new Error(msg); }
      return r;
    };
    return {
      list: async () => (await req('GET', '')).json(),
      create: async (name, autoName) => (await req('POST', '', { name, autoName })).json(),
      rename: async (id, name, autoName) => (await req('PATCH', '/' + id, { name, autoName })).json(),
      remove: async (id) => { await req('DELETE', '/' + id); },
      // 返回 {project, files:[{name, buf}], state}
      load: async (id) => {
        const d = await (await req('GET', '/' + id)).json();
        const files = await Promise.all(d.files.map(async f => ({ name: f.name, buf: await (await req('GET', '/' + id + '/files/' + enc(f.name))).arrayBuffer() })));
        return { project: d.project, files, state: d.state };
      },
      // 返回实际保存的文件名（同名不同内容时会加序号）
      saveFile: async (id, name, buf) => (await (await req('PUT', '/' + id + '/files/' + enc(name), buf, true)).json()).name,
      removeFile: async (id, name) => { await req('DELETE', '/' + id + '/files/' + enc(name)); },
      saveState: async (id, state) => { await req('PUT', '/' + id + '/state', state); },
      // 回收站：删除的项目先进这里，可以恢复或彻底删除
      trash: {
        list: async () => (await req('GET', '/.trash')).json(),
        restore: async (tid) => (await req('POST', '/.trash/' + tid)).json(),
        purge: async (tid) => { await req('DELETE', '/.trash/' + tid); }
      }
    };
  })(),
  // 旧版 .xls/.doc 转成 .xlsx/.docx（dev_server.py 调 LibreOffice），返回 ArrayBuffer
  convert: {
    file: async (name, buf, from, to) => {
      const r = await fetch(`/api/bidread/convert?from=${from}&to=${to}`, { method: 'POST', body: buf });
      if (!r.ok) { let msg = 'HTTP ' + r.status; try { msg = (await r.json()).error || msg; } catch (e) {} throw new Error(msg); }
      return r.arrayBuffer();
    }
  },
  // 扫描件 OCR：本机服务按需启动（tools/ocr_worker.py）。没装时 available() 为 false，页面只提示是扫描件
  ocr: {
    available: async () => { try { return !!(await (await fetch('/api/bidread/ocr')).json()).available; } catch (e) { return false; } },
    // 输入一页图片（PNG Blob），返回 [{text, box:[[x,y]*4], score}]，坐标是图片像素
    image: async (blob) => {
      const r = await fetch('/api/bidread/ocr', { method: 'POST', body: blob });
      if (!r.ok) { let msg = 'HTTP ' + r.status; try { msg = (await r.json()).error || msg; } catch (e) {} throw new Error(msg); }
      return (await r.json()).lines;
    }
  },
  downloads: {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); return { status: 'saved' };
    }
  }
};
</script>
<script>
/* DSH 工作台专用适配（scripts/build.mjs 注入） */
(function () {
  const AD = window.BIDREAD_ADAPTER;
  // 没有可用模型时（HTTP 503）给出明确提示，而不是笼统的“解读中断”
  // 模型请求：按后端返回的错误码给出具体原因（余额不足、未登录、限流……），而不是笼统的“模型服务出错”
  const json = AD.sample.json;
  const CODE = { QUOTA: 'quota', INSUFFICIENT_BALANCE: 'quota', AUTH: 'model_auth', MISSING_CREDENTIAL: 'model_auth', INVALID_CREDENTIAL: 'model_auth', RATE_LIMIT: 'rate_limited', CONTEXT_WINDOW_EXCEEDED: 'prompt_too_large', NO_MODEL: 'no_model', NO_LLM: 'no_model', NO_ADAPTER: 'no_model', EMPTY: 'empty_completion' };
  AD.sample.json = async (prompt, opts = {}) => {
    let r;
    try { r = await fetch('/api/bidread/llm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt }), signal: opts.signal }); }
    catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', message: String(e) }; }
    if (!r.ok) { let b = {}; try { b = await r.json(); } catch (e) {} throw { code: CODE[b.code] || (r.status === 429 ? 'rate_limited' : r.status === 413 ? 'prompt_too_large' : 'upstream_error'), message: b.error || ('HTTP ' + r.status), detail: b.error }; }
    const text = await r.text();
    try { return JSON.parse(text); } catch (e) {}
    const m = text.match(/[[{][sS]*[]}]/); if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
    throw { code: 'invalid_json', message: 'model output is not JSON', text };
  };
  // 模型选择：默认用 DSH 里的默认模型，也可以给工作台单独选
  AD.model = {
    get: async () => { const r = await fetch('/api/bidread/model'); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); },
    set: async (route) => { const r = await fetch('/api/bidread/model', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(route || {}) }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
  };
  // 当前项目和原文文字交给工作台后端，右侧 DSH 对话里的智能体用工具读取
  const post = (url, body, method) => fetch(url, { method: method || 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); });
  AD.dsh = {
    // 告诉后端当前项目，同时告诉外层面板（它据此为这个项目打开对应的 DSH 会话）
    setCurrent: (pid, name) => fetch('/api/bidread/current', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pid }) })
      .then(r => r.json()).then(r => { if (window.parent !== window) window.parent.postMessage({ type: 'bidread:project', pid, name, folder: r.folder }, location.origin); }),
    // 打开 / 收起右侧 DSH 对话
    toggleChat: () => { if (window.parent !== window) window.parent.postMessage({ type: 'bidread:chat' }, location.origin); },
    saveText: (pid, files) => post('/api/bidread/projects/' + pid + '/text', files, 'PUT')
  };
  // 写进 DSH 会话的输入框：交给外层面板（lib/client.js）处理
  if (window.parent !== window) AD.session = {
    draft: text => new Promise(resolve => {
      const id = Math.random().toString(36).slice(2);
      const done = r => { window.removeEventListener('message', on); clearTimeout(t); resolve(r); };
      const on = e => { if (e.source === window.parent && e.data && e.data.type === 'bidread:draft-result' && e.data.id === id) done(e.data); };
      const t = setTimeout(() => done({ ok: false, error: 'DSH 没有响应，请确认是在 DSH 工作台里打开的' }), 4000);
      window.addEventListener('message', on);
      window.parent.postMessage({ type: 'bidread:draft', id, text }, location.origin);
    })
  };
})();
</script>

<!-- 固定使用浅色主题：不跟随系统外观（macOS“自动”外观到晚上会切成深色，用户希望始终是原本的浅色） -->
<script>document.documentElement.setAttribute('data-theme','light');
/* 嵌在 DSH 工作台里时跟随 DSH 主题（深浅色、底色、文字、边框），DSH 切换主题时同步；单独打开保持浅色 */
(function(){
  if(!window.BIDREAD_ADAPTER||!window.BIDREAD_ADAPTER.dsh) return;
  var pd; try{ pd=window.parent.document; }catch(e){ return; } if(!pd||pd===document) return;
  function lum(c){ var m=String(c).match(/\d+(\.\d+)?/g); if(!m||m.length<3) return 1; return (0.299*m[0]+0.587*m[1]+0.114*m[2])/255; }
  function apply(){
    var root=pd.documentElement, cs=getComputedStyle(pd.body||root), v=function(n){ return cs.getPropertyValue('--dsw-alias-'+n).trim(); };
    var bg=v('bg-base')||cs.backgroundColor, src=root.getAttribute('data-ds-theme-source');
    var dark=src==='dark'||(src!=='light'&&lum(cs.backgroundColor)<0.5);
    var s=document.documentElement.style, mix=function(p){ return 'color-mix(in srgb, '+bg+', '+(dark?'white':'black')+' '+p+'%)'; };
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    s.setProperty('--surface',dark?mix(4):bg); s.setProperty('--bg',dark?bg:mix(4));
    s.setProperty('--line',mix(dark?10:9)); s.setProperty('--line-strong',mix(dark?18:16));
    if(v('label-primary')) s.setProperty('--ink',v('label-primary'));
    if(v('label-secondary')) s.setProperty('--muted',v('label-secondary'));
  }
  apply();
  try{ new MutationObserver(apply).observe(pd.documentElement,{attributes:true}); if(pd.body) new MutationObserver(apply).observe(pd.body,{attributes:true}); }catch(e){}
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',apply); }catch(e){}
})();</script>

const WS = /[\s　 ]/;
const strip = s => String(s??'').replace(/[\s　 ]/g,'').replace(/…|\.\.\./g,'');
function locate(text, quote){
  if(!text || !quote) return null;
  const map=[]; let st='';
  for(let i=0;i<text.length;i++){ const c=text[i]; if(!WS.test(c)){ map.push(i); st+=c; } }
  const q=strip(quote);
  if(q.length<2) return null;
  let k=st.indexOf(q);
  if(k>=0) return {s:map[k], e:map[k+q.length-1]+1, partial:false};
  if(q.length>=10){ const p=q.slice(0,10); k=st.indexOf(p); if(k>=0) return {s:map[k], e:map[k+p.length-1]+1, partial:true}; }
  return null;
}
function xmlEsc(s){ return String(s??'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function wRun(text,o={}){ const sz=o.sz||21; return `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="宋体"/>${o.b?'<w:b/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`; }
function wPara(runs,after=120){ return `<w:p><w:pPr><w:spacing w:after="${after}" w:line="360" w:lineRule="auto"/></w:pPr>${runs}</w:p>`; }
function wBlock(b){
  if(b.t==='h1') return wPara(wRun(b.text,{b:true,sz:36}),240);
  if(b.t==='h2') return wPara(wRun(b.text,{b:true,sz:28}),160);
  if(b.t==='h3') return wPara(wRun(b.text,{b:true,sz:24}),100);
  if(b.t==='note') return wPara(wRun(b.text,{sz:18,color:'666666'}),120);
  if(b.t==='p') return wPara(wRun(b.text),120);

async function readPdf(buf){
  const lib=await waitFor(()=>window.pdfjsLib,8000);
  if(!lib) throw new Error('PDF 解析组件没有加载');
  try{ if(!lib.GlobalWorkerOptions.workerSrc) lib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js'; }catch(e){}
  const pdf=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  const pages=[], tc=[]; let ratio='595/842';
  for(let i=1;i<=pdf.numPages;i++){
    const p=await pdf.getPage(i);
    if(i===1){ const v=p.getViewport({scale:1}); ratio=`${v.width}/${v.height}`; }
    const t=await p.getTextContent();
    const items=t.items.filter(it=>typeof it.str==='string').map(it=>({str:it.str,transform:it.transform,width:it.width,height:it.height,hasEOL:it.hasEOL}));
    tc.push(items);
    let s=''; for(const it of items){ s+=it.str; if(it.hasEOL) s+='\n'; }
    pages.push(s.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim());
  }
  return {kind:'pdf', unit:'页', pdf, pages, tc, ratio};
}

  return {kind:'docx', unit:'节', pages:chunk(lines), html:html.join('')};
}
/* 网页（交易平台上的补遗、更正公告常常只有网页）：只取标题、段落和表格的文字，脚本、图片、表单全部丢掉，
   重新拼成的 HTML 里所有文字都经过转义，不会执行原网页的任何代码 */
function readHtml(text){
  const doc=new DOMParser().parseFromString(text,'text/html');
  doc.querySelectorAll('script,style,noscript,iframe,object,embed,nav,form,button,input,select,textarea,svg,img,video,audio,link,meta').forEach(n=>n.remove());
  doc.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
  const html=[], lines=[], BLOCK='p,div,table,ul,ol,li,h1,h2,h3,h4,h5,h6,section,article,dl,blockquote,pre';
  const segs=n=>n.textContent.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  (function walk(n){ for(const c of [...n.children]){ const tag=c.tagName.toLowerCase();
    if(tag==='table'){ const rows=[...c.querySelectorAll('tr')].map(r=>[...r.children].filter(x=>/^t[dh]$/i.test(x.tagName)).map(td=>segs(td).join(' ')));
      html.push('<table>'+rows.map(r=>'<tr>'+r.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>').join('')+'</table>');
      rows.forEach(r=>{ const l=r.join(' | '); if(l.replace(/[|\s]/g,'')) lines.push(l); }); }
    else if(/^h[1-6]$/.test(tag)){ const t=segs(c).join(' '); if(t){ const l=Math.min(3,+tag[1]); html.push(`<h${l}>${esc(t)}</h${l}>`); lines.push(t); } }
    else if(c.querySelector(BLOCK)) walk(c);
    else for(const t of segs(c)){ html.push(`<p>${esc(t)}</p>`); lines.push(t); } } })(doc.body||doc.documentElement);
  if(!lines.length) throw new Error('网页里没有找到正文文字');
  return {kind:'docx', web:true, unit:'节', pages:chunk(lines), html:html.join('')};
}
const X_NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main', R_NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
function colIdx(ref){ let n=0; for(const ch of ref.replace(/\d+/g,'')) n=n*26+(ch.charCodeAt(0)-64); return n-1; }
function fmtCell(v){ if(typeof v==='number') return Number.isInteger(v)?v.toLocaleString('zh-CN'):v.toLocaleString('zh-CN',{maximumFractionDigits:2}); return v==null?'':String(v); }
function sheetText(sh){ return (`工作表「${sh.name}」\n`+sh.rows.filter(r=>r.some(c=>c!==''&&c!=null)).map(r=>r.map(fmtCell).join(' | ')).join('\n')).slice(0,12000); }
async function readXlsx(buf){
  const Z=await waitFor(()=>window.JSZip,8000); if(!Z) throw new Error('Excel 解析组件没有加载');
  const zip=await Z.loadAsync(buf); const dp=new DOMParser();
  const xml=async p=>{ const f=zip.file(p); return f?dp.parseFromString(await f.async('string'),'application/xml'):null; };
  const wb=await xml('xl/workbook.xml'); if(!wb) throw new Error('不是有效的 .xlsx 文件');
  const rels={}; const rd=await xml('xl/_rels/workbook.xml.rels'); if(rd) for(const r of rd.getElementsByTagName('Relationship')) rels[r.getAttribute('Id')]=r.getAttribute('Target');
  const ss=[]; const sd=await xml('xl/sharedStrings.xml'); if(sd) for(const si of sd.getElementsByTagNameNS(X_NS,'si')){ ss.push([...si.getElementsByTagNameNS(X_NS,'t')].filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join('')); }
  const sheets=[];
  for(const s of wb.getElementsByTagNameNS(X_NS,'sheet')){
    const rid=s.getAttributeNS(R_NS,'id')||s.getAttribute('r:id'); let tg=rels[rid]; if(!tg) continue;
    const path=tg.startsWith('/')?tg.slice(1):'xl/'+tg.replace(/^\.\//,'');
    const d=await xml(path); if(!d) continue;
    const rows=[];
    for(const row of d.getElementsByTagNameNS(X_NS,'row')){
      const ri=(+row.getAttribute('r')||rows.length+1)-1; const arr=rows[ri]=rows[ri]||[];
      for(const c of kids(row,'c')){ const ref=c.getAttribute('r'); const ci=ref?colIdx(ref):arr.length; const t=c.getAttribute('t'); const v=kid(c,'v')?.textContent; const f=kid(c,'f')?.textContent; let val;
        if(t==='s') val=ss[+v]??''; else if(t==='inlineStr') val=[...c.getElementsByTagNameNS(X_NS,'t')].map(x=>x.textContent).join(''); else if(t==='b') val=v==='1'?'TRUE':'FALSE'; else if(t==='str'||t==='e') val=v??''; else val=(v!=null&&v!=='')?Number(v):(f?'='+f:'');
        arr[ci]=val; }
    }
    for(let i=0;i<rows.length;i++) rows[i]=(rows[i]||[]).map(x=>x??'');
    while(rows.length && !rows[rows.length-1].some(x=>x!=='')) rows.pop();
    sheets.push({name:s.getAttribute('name')||('Sheet'+(sheets.length+1)), rows});
  }
  return {kind:'xlsx', unit:'表', sheets, pages:sheets.map(sheetText)};
}
function readCsv(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=''; } else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(c!=='\r') cur+=c; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  const sh={name:'CSV', rows:rows.map(r=>r.map(v=>/^-?\d+(\.\d+)?$/.test(v.trim())?Number(v):v))};
  return {kind:'xlsx', unit:'表', sheets:[sh], pages:[sheetText(sh)]};
}
function decodeText(buf){ const u=new Uint8Array(buf); try{ return new TextDecoder('utf-8',{fatal:true}).decode(u).replace(/^﻿/,''); }catch(e){ try{ return new TextDecoder('gbk').decode(u); }catch(e2){ return new TextDecoder().decode(u); } } }
function listSummary(f){
  const out=[];
  for(const sh of f.sheets||[]){
    const rows=sh.rows; let h=rows.findIndex(r=>r.filter(c=>typeof c==='string'&&c.trim()).length>=3);
    if(h<0) continue;
    const head=rows[h].map(c=>String(c));
    const isTot=r=>r.some(c=>typeof c==='string'&&/^\s*(合\s*计|总\s*计|小\s*计)/.test(c));
    const data=rows.slice(h+1).filter(r=>r.some(c=>c!=='')&&!isTot(r));
    const amounts=[];
    head.forEach((name,ci)=>{ if(!/合价|金额|总价|小计|合计|价款/.test(name)||/单价/.test(name)) return;
      const nums=data.map(r=>r[ci]).filter(v=>typeof v==='number'); if(!nums.length) return;
      const tr=rows.slice(h+1).find(isTot); const total=tr&&typeof tr[ci]==='number'?tr[ci]:null;
      amounts.push({name, sum:nums.reduce((a,b)=>a+b,0), total}); });
    out.push({sheet:sh.name, rows:data.length, amounts});
  }
  return out;
}
const money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});
function summaryText(f){ return (f.summary||[]).map(s=>`工作表「${s.sheet}」${s.rows} 项`+s.amounts.map(a=>`，${a.name}合计 ${money(a.sum)}${a.total!=null?`（表内合计行 ${money(a.total)}）`:''}`).join('')).join('；'); }

/* ---------- classify ---------- */
const RX={amend:/答疑|澄清|补遗|补充通知|补充说明|补充文件|补充公告|修改通知|变更|更正/,contract:/合同/,template:/投标文件格式|响应文件格式|格式|模板/,spec:/需求|技术规格|规格书|技术参数|技术要求/,drawing:/图纸|平面图|布置图|示意图|施工图|效果图|总图/,list:/清单|报价表|控制价|预算/,main:/招标文件|采购文件|磋商文件|询价文件|谈判文件|招标公告|采购公告/};
function classify(f){
  const n=f.name;
  if(f.kind==='xlsx') return 'list';
  if(f.kind==='none') return /\.(dwg|dxf)$/i.test(n)?'drawing':'other';
  const head=(f.pages||[]).slice(0,2).join(''), h=head.replace(/\s/g,'');
  const byName=['amend','contract','template','spec','drawing','list','main'].find(r=>RX[r].test(n));
  // 交易平台的附件常常名不副实（实测：“工程量固化清单附件1.pdf”其实是补遗书，“补遗文件附件1.pdf”其实是整份采购文件），
  // 所以内容标题明确时以内容为准：开头就写明补遗/澄清的归为补遗；名字像补遗、内容却是 20 页以上整份招标文件的归为正文
  if(/补遗书|补遗文件|澄清文件|澄清公告|澄清说明|答疑纪要|答疑文件|更正公告|变更公告|补充通知|补充说明|补充文件|补充公告|修改通知/.test(h.slice(0,120))) return 'amend';
  if(byName==='amend' && (f.pages?.length||0)>=20 && /招标文件|采购文件|磋商文件|谈判文件/.test(h.slice(0,200)) && !/补遗|澄清|答疑|更正/.test(h.slice(0,120))) return 'main';
  if(byName) return byName;
  if(f.kind==='pdf' && f.chars < f.pages.length*40) return 'drawing';
  // 内容判断都用去掉空白的文字（封面常排成“招 标 文 件”）；先看封面标题区，避免目录里的“第三章 采购需求”把正文误判为需求书
  if(/招标文件|采购文件|磋商文件|询价文件|谈判文件|招标公告|采购公告/.test(h.slice(0,200))) return 'main';
  if(/答疑|澄清|补遗/.test(h.slice(0,300))) return 'amend';
  if(/合同/.test(h.slice(0,150))) return 'contract';
  if(/采购需求|技术规格|用户需求/.test(h.slice(0,300))) return 'spec';
  if(/招标文件|采购文件|招标公告|采购公告|磋商文件/.test(h.slice(0,1500))) return 'main';
  return 'other';
}
function amendMeta(f){
  const m=f.name.match(/第\s*([一二三四五六七八九十\d]+)\s*次/)||f.name.match(/(?:答疑|澄清|补遗|变更|更正)[^\d一二三四五六七八九十]{0,4}([一二三四五六七八九十\d]+)/);
  const num=m?(CN[m[1]]||+m[1]||null):null;
  const d=(f.pages||[]).join('').slice(0,3000).match(/(20\d{2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  const date=d?`${d[1]}-${d[2].padStart(2,'0')}-${d[3].padStart(2,'0')}`:null;
  return {num,date};
}
function orderAmends(){
  const am=S.files.filter(f=>f.role==='amend');
  am.forEach((f,i)=>{ const m=amendMeta(f); f.anum=m.num; f.date=m.date; f.seq=i; });
  am.sort((a,b)=>(a.anum??99)-(b.anum??99)||String(a.date??'9').localeCompare(String(b.date??'9'))||a.seq-b.seq).forEach((f,i)=>f.order=i+1);
  if(!S.files.some(f=>f.role==='main')){ const c=S.files.filter(f=>['other'].includes(f.role)&&(f.kind==='pdf'||f.kind==='docx')).sort((a,b)=>b.chars-a.chars)[0]; if(c) c.role='main'; }
}
function sortedFiles(){ return [...S.files].sort((a,b)=>ROLE_ORDER.indexOf(a.role)-ROLE_ORDER.indexOf(b.role)||(a.order||0)-(b.order||0)||a.idx-b.idx); }
function participates(f){ return f.role!=='drawing' && f.kind!=='none' && f.pages?.some(p=>p.trim()); }
function shortLabel(f){
  if(!f) return '?';

/* ---------- ingest ---------- */
async function unzip(buf){
  const Z=await waitFor(()=>window.JSZip,8000); if(!Z) throw new Error('解压组件没有加载');
  const dec=b=>{ try{ return new TextDecoder('utf-8',{fatal:true}).decode(b); }catch(e){ try{ return new TextDecoder('gbk').decode(b); }catch(e2){ return new TextDecoder().decode(b); } } };
  const zip=await Z.loadAsync(buf,{decodeFileName:dec});
  const out=[];
  for(const e of Object.values(zip.files)){ if(e.dir) continue; const nm=e.name.split('/').pop(); if(!nm||nm.startsWith('.')||e.name.includes('__MACOSX')) continue; out.push({name:nm, buf:await e.async('arraybuffer')}); }
  return out;
}
async function expand(list){
  const out=[];
  for(const it of list){
    if(/\.zip$/i.test(it.name)){ try{ out.push(...await unzip(it.buf)); }catch(e){ toast(`${it.name} 解压失败`); } }
    else out.push(it);
  }
  return out;
}
/* ---------- 扫描件 OCR（按需）----------
   PDF 里没有文字层的页才处理：用 pdf.js 渲染成图片，交给宿主的 OCR（BIDREAD_ADAPTER.ocr，本地服务按需启动）。
   识别结果转成和文字层相同的格式（每行一个 item，坐标换回 PDF 坐标），出处定位和标黄照常可用。
   宿主没有 OCR 时不处理，文件标为扫描件。 */
async function ocrScanned(f){
  const idx=f.pages.map((t,i)=>t.replace(/\s/g,'').length<15?i:-1).filter(i=>i>=0);
  if(!idx.length || /图纸|平面图|示意图|效果图|施工图|布置图|dwg/i.test(f.name)) return;   // 图纸不识别
  const ocr=window.BIDREAD_ADAPTER?.ocr;
  if(!ocr||!await ocr.available().catch(()=>false)){ f.ocrNote=`有 ${idx.length} 页是扫描页（没有文字层），本机没有 OCR，这些页不参与解读`; return; }
  const S2=2; let done=0, failed=0;
  for(const i of idx){
    setDocMsg(`正在识别扫描页 ${done+failed+1} / ${idx.length}：${f.name}（第一次识别较慢，之后会记住结果）`);
    try{
      const page=await f.pdf.getPage(i+1), vp=page.getViewport({scale:S2}), vp1=page.getViewport({scale:1});
      const cv=document.createElement('canvas'); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      const lines=(await ocr.image(blob)).filter(l=>l.text&&l.score>=0.5);
      // 按行排：先按上沿分行（高度一半以内算同一行），行内从左到右
      const L=lines.map(l=>{ const xs=l.box.map(p=>p[0]), ys=l.box.map(p=>p[1]); return {text:l.text,x0:Math.min(...xs)/S2,x1:Math.max(...xs)/S2,y0:Math.min(...ys)/S2,y1:Math.max(...ys)/S2}; })
        .sort((a,b)=>a.y0-b.y0||a.x0-b.x0);
      const rows=[]; for(const l of L){ const r=rows[rows.length-1]; if(r&&Math.abs(r[0].y0-l.y0)<(l.y1-l.y0)*0.5) r.push(l); else rows.push([l]); }
      const items=[];
      for(const r of rows){ r.sort((a,b)=>a.x0-b.x0); r.forEach((l,k)=>{ const h=Math.max(4,l.y1-l.y0), [px,py]=vp1.convertToPdfPoint(l.x0,l.y1-h*0.15);
        items.push({str:l.text,transform:[h,0,0,h,px,py],width:l.x1-l.x0,height:h,hasEOL:k===r.length-1}); }); }
      f.tc[i]=items; f.pages[i]=rows.map(r=>r.map(l=>l.text).join(' ')).join('\n'); done++;
    }catch(e){ failed++; console.warn('OCR 失败',f.name,i+1,e); }
  }
  f.ocrDone=done;
  if(failed) f.ocrNote=`有 ${failed} 页扫描页没有识别成功，这些页不参与解读`;
}
async function toFile(it){
  const ext=(it.name.split('.').pop()||'').toLowerCase();
  const f={id:'f'+(++fid), idx:fid, name:it.name, ext, hash:await hashOf(it.buf), size:it.buf.byteLength, vps:{}, drawn:new Map(), tasks:{}};
  try{
    if(ext==='pdf') Object.assign(f, await readPdf(it.buf.slice(0)));
    else if(ext==='docx') Object.assign(f, await readDocx(it.buf.slice(0)));
    else if(ext==='xlsx') Object.assign(f, await readXlsx(it.buf.slice(0)));
    else if(ext==='csv') Object.assign(f, readCsv(decodeText(it.buf)));
    else if(ext==='html'||ext==='htm') Object.assign(f, readHtml(decodeText(it.buf)));
    else if((ext==='xls'||ext==='doc') && window.BIDREAD_ADAPTER?.convert?.file){
      // 旧版 Office 格式交给宿主转换（本地服务调 LibreOffice），转好后按 .xlsx/.docx 读取
      const to=ext==='xls'?'xlsx':'docx', b=await window.BIDREAD_ADAPTER.convert.file(it.name,it.buf.slice(0),ext,to);
      Object.assign(f, to==='xlsx'?await readXlsx(b):await readDocx(b)); f.converted=ext; }
    else { f.kind='none'; f.pages=[]; f.note= ext==='doc'||ext==='xls' ? `旧版 .${ext} 格式暂不支持，请另存为 .${ext}x 后再添加` : ext==='rar'||ext==='7z' ? '请先解压，再把里面的文件拖进来' : `.${ext} 文件暂不支持预览`; }
  }catch(e){ f.kind='none'; f.pages=[]; f.note='读取失败：'+(e?.message||'文件可能已损坏'); }
  if(f.kind==='pdf') await ocrScanned(f);
  f.chars=(f.pages||[]).join('').replace(/\s/g,'').length;
  if(f.kind==='xlsx') f.summary=listSummary(f);
  f.role=classify(f);
  if(f.ocrNote) f.note=f.ocrNote;   // 扫描件：不管被归成什么类型，都要说清楚为什么没参与解读
  else if(f.kind==='pdf' && f.role!=='drawing' && f.chars<f.pages.length*40) f.note='几乎没有可读文字，可能是扫描件，暂不参与解读';
  else if(f.ocrDone) f.note=`其中 ${f.ocrDone} 页是扫描页，已用 OCR 识别成文字，个别字可能有误，以原文为准`;
  return f;
}
async function ingest(list,{append=false,sample=false}={}){
  abortAll();
  setDocMsg(`正在读取 ${list.length} 个文件…`);
  S.busy=true;
  const items=await expand(list);
  const files=[];
  for(let i=0;i<items.length;i++){ setDocMsg(`正在读取 ${i+1} / ${items.length}：${items[i].name}`); files.push(await toFile(items[i])); }
  S.busy=false;
  if(!files.length){ toast('没有可以读取的文件'); renderDoc(); return; }
  if(PJ && !sample){
    // 追加到当前项目；当前是空项目时直接放进去；否则新建一个项目
    const into=!S.sample && S.pid && (append || !S.files.length) ? S.pid : null;
    let pid=into;
    try{
      if(!pid){ const main=files.find(f=>f.role==='main')||files[0]; const m=await PJ.create(main.name.replace(/\.[^.]+$/,''),true); pid=m.id; P.cur=m; }
      const known=new Set(pid===S.pid?S.files.map(f=>f.hash):[]);
      for(let i=0;i<files.length;i++){ if(known.has(files[i].hash)) continue; setDocMsg(`正在保存到项目 ${i+1} / ${files.length}：${files[i].name}`); files[i].name=await PJ.saveFile(pid,items[i].name,items[i].buf); }
    }catch(e){ toast('文件没有保存到项目里：'+(e?.message||e)); }
    if(pid && pid!==S.pid){ flushPersist(); S.pid=pid; rememberProject(pid); }
    if(into && !S.files.length) append=false;  // 空项目里第一次放文件，按整套新资料处理
    refreshProjects();
  }
  if(append && S.files.length){
    const known=new Set(S.files.map(f=>f.hash)); const fresh=files.filter(f=>!known.has(f.hash));
    if(!fresh.length){ toast('这些文件已经在项目里了'); renderDoc(); return; }
    S.files.push(...fresh); orderAmends(); S.sample=false; S.pkey=projectKey(); S.prev=JSON.parse(JSON.stringify(S.res)); S.stale=true;
    S.view=fresh[0].id; S.tab='files'; citeCache.clear();
    toast(`已添加 ${fresh.length} 个文件，正在重新解读`); renderDoc(); render();
    if(sampleFn) runAll(true); persist();
    return;
  }
  setProject(files,{sample, saved:PJ&&!sample?null:undefined});
}
/* 宿主是 DSH 工作台时：告诉它当前打开的是哪个项目，并把页面识别出的原文文字交过去，

/* 页面内弹窗，替代浏览器自带的 confirm / prompt（样式统一，Esc 取消、回车确定）。返回 Promise：确定→true 或输入的文字，取消→null */
function uiDialog({title,body='',input=null,ok='确定',danger=false}){
  return new Promise(res=>{
    const el=document.createElement('div'); el.className='modal';
    el.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body?`<p>${esc(body).replace(/\n/g,'<br>')}</p>`:''}${input!=null?`<input class="modal-in" type="text" value="${esc(input)}" autocomplete="off">`:''}<div class="modal-act"><button class="btn" type="button" data-md="0">取消</button><button class="btn ${danger?'danger':'primary'}" type="button" data-md="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(el);
    const val=()=>input!=null?el.querySelector('.modal-in').value:true;
    const done=v=>{ el.remove(); document.removeEventListener('keydown',key,true); res(v); };
    const key=e=>{ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(null); } else if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); done(val()); } };
    document.addEventListener('keydown',key,true);
    el.addEventListener('click',e=>{ const b=e.target.closest('[data-md]'); if(b) done(b.dataset.md==='1'?val():null); else if(e.target===el) done(null); });
    setTimeout(()=>{ const i=el.querySelector('.modal-in'); if(i){ i.focus(); i.select(); } else el.querySelector('[data-md="1"]').focus(); },0);
  });
}

function pick(mod,tags,extra=[]){
  const BUDGET_=mod==='ov:parties'?60000:BUDGET;   // 联系方式集中在公告和须知开头，少挑一些页
  const wt=WT[mod]||(mod==='ov:money'?{...WT.overview,contract:.8}:WT.overview); const units=[];
  for(const f of sortedFiles()){ if(!participates(f)) continue; const w=wt[f.role]??.3; if(!w) continue;
    f.pages.forEach((t,i)=>{ let s=0; for(const k of [...(KEYS[mod]||[]),...extra]){ const n=t.split(k).length-1; s+=Math.min(n,6); }
      if(/前附表/.test(t)) s+=60;
      if(/^ov/.test(mod) && f.role==='main' && i<3) s+=200;  // 封面和公告开头：项目编号、名称常常只印在封面上
      units.push({f, i, t, b:enc.encode(t).length+40, s:(s+1)*w+(f.role==='amend'?1000:0)}); }); }
  const total=units.reduce((a,u)=>a+u.b,0); let chosen=units, partial=false;
  if(total>BUDGET_){ partial=true; chosen=[]; let used=0; for(const u of [...units].sort((a,b)=>b.s-a.s)){ if(used+u.b>BUDGET_) continue; chosen.push(u); used+=u.b; } chosen.sort((a,b)=>units.indexOf(a)-units.indexOf(b)); }
  return (partial?'（资料较长，下面只给出与本任务相关的部分，页码保持原始编号。）\n\n':'')+chosen.map(u=>`【${tags.get(u.f.id)} · 第${u.i+1}${u.f.unit}】\n${u.t}`).join('\n\n');
}

/* ---------- 长资料分段抽取 ----------
   风险和材料散落在全文各处，资料超过 SEG_LIMIT 时一次挑页会漏条款（真实标书实测约漏 30%），
   所以按页切成几段分别抽取，再由程序去重合并。补遗每段都带上，以便判断覆盖关系。 */
const SEG_MODS=new Set(['risks','materials']), SEG_LIMIT=100000, SEG_CHUNK=80000;
function segChunks(mod){
  if(!SEG_MODS.has(mod)) return null;
  const wt=WT[mod], units=[];
  for(const f of sortedFiles()){ if(!participates(f) || !(wt[f.role]??.3)) continue;
    f.pages.forEach((t,i)=>{
      // 材料清单不看合同条款章节：那里只有中标后的履约资料，单独成段时模型会把它们误列为投标材料
      if(mod==='materials' && /合同/.test(chapterOf(f,i+1)||'')) return;
      units.push({f,i,t,b:enc.encode(t).length+40}); }); }
  if(units.reduce((a,u)=>a+u.b,0)<=SEG_LIMIT) return null;
  let amend=units.filter(u=>u.f.role==='amend'), rest=units.filter(u=>u.f.role!=='amend');
  // 项目里只有补遗（如只拿到了补遗书和它附带的清单）时，直接把补遗分段；否则每段都带上全部补遗
  if(!rest.length){ rest=amend; amend=[]; }
  const cap=Math.max(30000,SEG_CHUNK-amend.reduce((a,u)=>a+u.b,0)); const out=[]; let cur=[], used=0;
  for(const u of rest){ if(cur.length && used+u.b>cap){ out.push(cur); cur=[]; used=0; } cur.push(u); used+=u.b; }
  if(cur.length) out.push(cur);
  return out.length?out.map(c=>[...c,...amend]):null;
}
/* 全文里“★/▲ 表示什么”的说明句，每段都带上：各地标书里★有时是废标项、有时只是计分参数 */
function symbolNotes(tags){
  const out=new Set();
  for(const f of sortedFiles()){ if(!participates(f)) continue;
    f.pages.forEach((t,i)=>{ for(const s of t.split(/[\n。；]/)){ const x=s.trim();
      if(x.length<160 && /[★▲■●█]/.test(x) && /(实质性|无效|否决|废标|扣\s*\d|扣分|负偏离|重要|一般|代表|表示|标注|标记)/.test(x)) out.add(`【${tags.get(f.id)} · 第${i+1}${f.unit}】${x}`); } }); }
  return [...out].slice(0,12);
}
function segBody(units,k,n,notes,tags){
  return `（资料较长，分 ${n} 段处理，这是第 ${k} 段，页码保持原始编号。只列出本段文本中出现的条款，其他段会另外处理。）\n`
    +(notes.length?`符号说明（程序从全文摘出，供判断 ★ 等标记的含义）：\n${notes.join('\n')}\n`:'')
    +'\n'+units.map(u=>`【${tags.get(u.f.id)} · 第${u.i+1}${u.f.unit}】\n${u.t}`).join('\n\n');
}
const bigrams=s=>{ const t=String(s||'').replace(/[^\u4e00-\u9fa5A-Za-z0-9★▲]/g,''); const g=new Set(); for(let i=0;i<t.length-1;i++) g.add(t.slice(i,i+2)); return g; };
const jac=(a,b)=>{ if(!a.size||!b.size) return 0; let n=0; for(const x of a) if(b.has(x)) n++; return n/(a.size+b.size-n); };
function dedupe(list,key){
  const kept=[];
  const nm=v=>String(v||'').replace(/[^\u4e00-\u9fa5A-Za-z0-9★▲]/g,'');
  for(const x of list){ const g=bigrams(key(x)), q=String(x?.quote||'').replace(/\s/g,''), n=nm(key(x));
    // 同一引文、文字高度相似、或一个名称完整包含另一个（如“投标保证金”与“投标保证金（支票、汇票…）”）都算重复
    if(kept.some(k=>(q && q===k.q) || jac(g,k.g)>=0.6 || (Math.min(n.length,k.n.length)>=4 && (n.includes(k.n)||k.n.includes(n))))) continue;
    kept.push({x,g,q,n}); }
  return kept.map(k=>k.x);
}
function mergeSeg(mod,outs,tags){
  const ord=new Map([...tags.values()].map((t,i)=>[t,i]));
  const pos=o=>[(ord.get(String(o?.file||'').toUpperCase())??99), (parseInt(o?.page,10)||0)];
  const byPos=(a,b)=>{ const x=pos(a), y=pos(b); return x[0]-y[0]||x[1]-y[1]; };
  if(mod==='risks'){ const r={}; for(const [g] of RISK_GROUPS) r[g]=dedupe(outs.flatMap(o=>Array.isArray(o?.[g])?o[g]:[]).sort(byPos),x=>x?.text); return r; }
  return {items:dedupe(outs.flatMap(o=>Array.isArray(o?.items)?o.items:[]),x=>x?.name)};  // 材料按各段顺序（≈装订顺序）
}
async function runSegments(mod,tags,segs,opts){
  const notes=symbolNotes(tags), n=segs.length, outs=new Array(n); let next=0;
  S.seg[mod]={done:0,n}; render();
  const one=k=>sampleFn.json(buildPrompt(mod,tags,segBody(segs[k],k+1,n,notes,tags)),opts);
  const failed=[]; let lastErr=null;
  const worker=async()=>{ while(next<n){ const k=next++; let d=null;
    try{ d=await one(k); }
    catch(e){ if(e?.code==='cancelled'||FATAL.has(e?.code)) throw e;
      if(e?.code!=='content_filtered'){ try{ d=await one(k); }catch(e2){ if(e2?.code==='cancelled'||FATAL.has(e2?.code)) throw e2; lastErr=e2; } }  // 单段失败重试一次
      else lastErr=e;
      if(!d){ const u=segs[k].filter(x=>x.f.role!=='amend'); failed.push({k:k+1, file:u[0]?.f.id, from:u[0]?.i+1, to:u[u.length-1]?.i+1, code:lastErr?.code||'upstream_error'}); } }
    outs[k]=d; S.seg[mod].done++; render(); } };
  try{ await Promise.all(Array.from({length:Math.min(3,n)},worker)); }
  finally{ delete S.seg[mod]; }
  if(failed.length===n) throw lastErr||{code:'upstream_error'};
  // 个别段失败不拖垮整个模块：其余段照常合并，页面上明确列出哪些页没处理成功
  const merged=mergeSeg(mod,outs.filter(Boolean),tags);
  if(failed.length) merged.segFailed=failed.sort((a,b)=>a.k-b.k);
  return merged;
}

/* ---------- ★ 的含义 ----------
   各地标书里 ★ 有的表示实质性要求（不满足即无效），有的只是评分参数（不满足扣分）。
   实测只在提示词里提醒，模型仍会把计分的 ★ 参数当成实质性要求，所以先用一次小调用判定含义，
   结论写进风险提示词；判定为“计分”时，程序再剔除误放进 star 的 ★ 参数。 */
function starSnippets(tags){
  const out=[], seen=new Set();
  for(const f of sortedFiles()){ if(!participates(f)) continue;
    f.pages.forEach((t,i)=>{ const x=t.replace(/\s+/g,''); let k=-1;
      while((k=x.indexOf('★',k+1))>=0){ const w=x.slice(Math.max(0,k-60),k+80), key=x.slice(k,k+30); if(seen.has(key)) continue; seen.add(key);
        out.push({sc:/(评分|得分|得\d|扣\d|扣分|实质性|负偏离|无效|否决|废标|标注|代表|表示|标记|符号)/.test(w)?1:0, s:`【${tags.get(f.id)} · 第${i+1}${f.unit}】…${w}…`}); } }); }
  return out.sort((a,b)=>b.sc-a.sc).slice(0,15).map(o=>o.s);
}
async function starMeaning(tags,opts){
  const sn=starSnippets(tags); if(!sn.length) return null;
  try{
    const d=await sampleFn.json(`下面是一份招标文件里出现“★”符号的上下文片段（每段以【文件编号 · 第N页】开头）。判断这份文件里“★”的含义：
- substantive：★ 标注实质性要求（不满足即投标无效、不允许负偏离）
- score：★ 标注评分用的重要参数（满足得分、不满足扣分，不导致投标无效）
- both：两种用法都有
- unknown：片段里看不出来
只输出 JSON：{"meaning":"substantive 或 score 或 both 或 unknown","file":"F1","page":1,"quote":"最能说明含义的原文，逐字复制，10 到 40 字"}

${sn.join('\n')}`,opts);
    return {meaning:['substantive','score','both','unknown'].includes(d?.meaning)?d.meaning:'unknown', file:d?.file, page:d?.page, quote:str(d?.quote)};
  }catch(e){ if(e?.code==='cancelled'||FATAL.has(e?.code)) throw e; console.warn('★ 含义判定失败，按通用规则抽取', e); return null; }
}
const STAR_RULE={substantive:'本文件中“★”表示实质性要求，标 ★ 的条款放进 star。',
  score:'本文件中“★”表示评分用的重要参数，不满足只扣分、不导致投标无效。带 ★ 的技术参数不要放进 star；star 只放写明“实质性要求”“不允许负偏离”或不满足即投标无效的条款。',
  both:'本文件中“★”两种用法都有。只把写明不满足即投标无效或不允许负偏离的 ★ 条款放进 star，评分用的 ★ 参数不要放。'};
const STAR_LABEL={substantive:'实质性要求（不满足即投标无效）',score:'评分用的重要参数（不满足扣分，不导致无效）',both:'两种用法都有：部分为实质性要求，部分为评分参数'};

function qaPrompt(q,tags){
  const cs=q.replace(/[^一-龥A-Za-z0-9★▲]/g,''); const bg=[]; for(let i=0;i<cs.length-1;i++) bg.push(cs.slice(i,i+2));

输出：{"found":true,"answer":"直接回答，一到三句，已考虑补遗","citations":[{${'"file":"F1","page":1,"quote":"..."'}}]}
找不到答案时输出 {"found":false,"answer":"资料中未找到相关规定","citations":[]}。

const SK_CH = t => /格式/.test(t || '') && !/合同/.test(t || '');   // 投标文件格式 / 响应文件格式；不含“合同条款及格式”

const SK_DOC = /(函|表|书|证明|声明|清单|附录|机构|方案|设计|资料|材料|文件|报告|证书|协议|明细|简介|情况|状况|保证金|计划|图|承诺|回执|封面|索引|要求|凭证|证件|报价)$/;
const SK_BAD = /^(我方|我司|我公司|我单位|本|投标人应|投标人须|注|说明|备注|如|若|根据|按照|以上|上述|填表|此|其中|如果|在|对|由|经|为|将|有|无|应|可|不|请|致|提供|中标后|完全|特此|就|该|序号|下|上|函|第.{1,3}[章节部分卷])|[，,；;]|目\s*录|格式说明|填写说明|注意事项|按照|详见|具体见|见第|见价格|如下|进行|均应|允许|可按|可自行|填写本表|符合招标|事宜|[须需]提供|[：:]|^(投标|响应|磋商)文件$/;
const skNorm = t => String(t || '').replace(/[（(][^）)]{0,12}[）)]$/, '').replace(/(参考)?格式$/, '').replace(/[^一-龥A-Za-z0-9]/g, '');
function skClean(t) {
  return String(t || '').replace(/[；;。：:]+$/, '').replace(/\s+/g, '').replace(/^[、，,.．]+/, '')
    .replace(/^附[：:]?\s*\d*[.．、]?/, '').replace(/^[（(]\d{1,2}[)）]/, '').replace(/^(表\d+|\d+-\d+|\d{1,2})(?=[一-龥])/, '').replace(/^[《“☑□]|[》”]$/g, '').trim();
}
const skBalanced = t => { let d = 0; for (const c of t) { if (c === '（' || c === '(') d++; else if (c === '）' || c === ')') { d--; if (d < 0) return false; } } return d === 0; };
function skIsTitle(t) {
  const core = skClean(t).replace(/[（(][^）)]{0,14}[）)]$/, '').replace(/(参考)?格式$/, '');
  return core.length >= 3 && core.length <= 30 && !/^[一-龥]、/.test(core) && !/(投标|响应|磋商)文件$/.test(core) && SK_DOC.test(core) && !SK_BAD.test(core) && skBalanced(core) && !/\d{4}年|[=＝%]|质疑|投诉/.test(core);
}
function skHeads(txt) {
  const lines = String(txt || '').split('\n').map(s => s.trim()).filter(Boolean)
    .filter(l => !/^[—\-\s]*\d+[—\-\s]*$|^第\s*\d+\s*页|https?:|www\.|︱/.test(l));   // 页码、页眉网址
  const out = [];
  lines.forEach((l, j) => {
    const x = l.replace(/\s+/g, ' ').trim(), m = x.match(SK_NUM);
    if (m) { const t = skClean(m[6]); if (skIsTitle(t)) out.push({ t, lvl: (m[2] || m[4]) ? 2 : 1, top: j < 3 }); return; }
    if (j < 3 && skIsTitle(x) && x.length <= 30) out.push({ t: skClean(x), lvl: 1, top: true });   // 不编号、写在页顶的表单名
  });
  return { heads: out, lines };
}
/* pages：逐页文字；chapterOf(i) 返回第 i 页（从 1 起）所属章节名。返回 [{name,page,group,src}] */
function skFromFormat(pages, chapterOf, wholeFile) {
  const hits = [];
  pages.forEach((txt, i) => {
    if (!wholeFile && !SK_CH(chapterOf(i + 1))) return;
    const { heads, lines } = skHeads(txt);
    const toc = heads.length >= 4 && heads.length >= lines.length * 0.5;   // 目录页：只用来补漏
    let prev = null; const listy = heads.length >= 3;                    // 列表页（一页列了好几项）：页码优先指向各表单自己的页
    for (const h of heads) {
      if (prev && skNorm(prev.t) === skNorm(h.t)) continue;               // 同页“2 投标函格式 / 投标函”这类重复
      hits.push({ ...h, page: i + 1, toc, listy }); prev = h;
    }
  });
  const body = hits.filter(h => !h.toc), tocOnly = hits.filter(h => h.toc && !body.some(b => skNorm(b.t) === skNorm(h.t)));
  const seq = [...body, ...tocOnly].sort((a, b) => a.page - b.page);
  const out = []; let group = null, kids = 0;
  const add = (name, page, g, h) => {
    const same = out.find(o => (o.group || '') === (g || '') && skNorm(o.name) === skNorm(name));
    if (!same) { out.push({ name, page, group: g || null, listy: !!(h && h.listy) }); return; }
    if (same.listy && h && !h.listy && h.top) { same.page = page; same.listy = false; }   // 先在列表页见到、后在表单页顶见到：改指表单页
  };
  const flush = () => { if (group && !kids) add(group.t, group.page, null, group); };
  for (const h of seq) {
    if (h.lvl === 1) { if (group && skNorm(group.t) === skNorm(h.t)) { if (group.listy && !h.listy && h.top) group = { ...group, page: h.page, listy: false }; continue; } flush(); group = h; kids = 0; }
    else { kids++; add(h.t, h.page, group ? group.t : null, h); }
  }
  flush();
  return out.map(({ listy, ...o }) => ({ ...o, src: '格式' }));
}
/* “投标文件应包括下列内容：（1）…（2）…” */
function skFromClause(pages) {
  const out = [];
  pages.forEach((txt, i) => {
    const lines = String(txt || '').split('\n').map(s => s.trim()).filter(Boolean);
    lines.forEach((l, j) => {
      const lx = l.replace(/\s+/g, '');
      if (!/(投标|响应|磋商)文件(应|由|主要)?.{0,6}(包括|包含|组成)[^。]{0,12}[：:]?$/.test(lx) || /格式|密封|签署|递交/.test(lx)) return;
      for (let k = j + 1, n = 0; k < lines.length && n < 30; k++, n++) {
        const x = lines[k].replace(/\s+/g, '');
        if (/^\d+\.\d+/.test(x)) break;                        // 下一条款
        const m = x.match(/^(?:[（(]\d{1,2}[)）]|\d{1,2}[、.．](?!\d)|[①-⑳])(.+)$/);
        if (!m) { if (out.length && n > 2 && !/信封|部分|文件[：:]?$/.test(x)) break; continue; }
        const t = skClean(m[1]);
        if (t.length >= 2 && t.length <= 40 && !SK_BAD.test(t) && !/(包括|组成)/.test(t)) out.push({ name: t, page: i + 1, group: null, src: '组成条款' });
      }
    });
  });
  return out;
}
function skMerge(fmt, clause) {
  const out = [...fmt];
  for (const c of clause) {
    const k = skNorm(c.name);
    if (k.length < 2) continue;
    if (!out.some(o => { const n = skNorm(o.name); return n === k || (k.length >= 4 && n.length >= 4 && (n.includes(k) || k.includes(n))) || (o.group && skNorm(o.group).includes(k)); })) out.push(c);
  }
  return out;
}
/*SKELETON-END*/
/* 项目的材料骨架（跨文件），按“正文 → 格式文件”的顺序；结果按文件和类型缓存 */
const skCache=new Map();
function projectSkeleton(){
  const key=S.files.map(f=>f.id+':'+f.role).join(','); if(skCache.has(key)) return skCache.get(key);
  const out=[];
  for(const f of sortedFiles()){
    if(!f.pages?.length || f.kind==='xlsx' || !['main','template','other','spec'].includes(f.role)) continue;
    const fmt=skFromFormat(f.pages,i=>chapterOf(f,i),f.role==='template'), cl=f.role==='main'?skFromClause(f.pages):[];
    for(const o of skMerge(fmt,cl)) if(!out.some(x=>skNorm(x.name)===skNorm(o.name)&&(x.group||'')===(o.group||''))) out.push({...o,file:f.id});
  }
  skCache.set(key,out); return out;
}
function skMatch(a,b){ const x=skNorm(a), y=skNorm(b); if(!x||!y) return 0; if(x===y) return 3; if(Math.min(x.length,y.length)>=4&&(x.includes(y)||y.includes(x))) return 2; return jac(bigrams(x),bigrams(y))>=0.5?1:0; }
/* 材料清单 = 骨架里的表单（标书列明，一张不少，按标书顺序） + 其他材料（资格、评分等要求的证明）。
   骨架在显示时计算，所以旧的解读结果也能用；骨架里有、模型没列的表单由程序补上并标明 */
const mtName=o=>o.sk?o.sk.name:o.x.name;
function materialsModel(){
  const items=S.res.materials?.items||[], used=new Set(), forms=[];
  for(const sk of projectSkeleton()){
    let best=-1, score=0;
    items.forEach((x,i)=>{ if(used.has(i)) return; const sc=skMatch(sk.name,x.name); if(sc>score){ score=sc; best=i; } });
    if(best>=0){ used.add(best); forms.push({x:items[best], i:best, key:'mt:'+best, sk}); continue; }
    const f=fileById(sk.file);
    forms.push({ key:'mt:sk:'+skNorm(sk.name)+':'+sk.page, sk, added:true,
      x:{ name:sk.name, need:/如适用|如有|若有|不适用|仅.{0,12}提供/.test(sk.name)?'如适用':'必须', form:`按投标文件格式填写（${f?shortLabel(f)+' ':''}第 ${sk.page} ${f?.unit||'页'}）`, file:sk.file, page:sk.page, quote:sk.name, changedFrom:null } });
  }
  return { forms, others:items.map((x,i)=>({x, i, key:'mt:'+i})).filter(o=>!used.has(o.i)) };
}
function byPosition(list){ return list.map((x,i)=>({x,i,p:posOf(x)})).sort((a,b)=>cmpPos(a.p,b.p)||a.i-b.i); }

function setDocMsg(msg,warn){ $('#doc').innerHTML=`<div class="doc-empty">${warn?'<span class="chip amber">无法读取</span>':'<span class="spin"></span>'}<div>${esc(msg)}</div>${warn?'<button class="btn" type="button" data-act="new">打开招标资料</button>':''}</div>`; }
let io=null, roT;
function renderDoc(){
  const f=fileById(S.view)||sortedFiles()[0];
  if(!f){
    if(PJ && S.pid && !S.sample){ $('#doc').innerHTML=`<div class="dropzone"><b>${esc(P.cur?.name||'新项目')}</b><div>把这个项目的招标资料拖到这里，或者</div><button class="btn primary" type="button" data-act="add">选择文件</button><div class="sub">可以一次放入多个文件或 zip 包：PDF、Word（.docx）、Excel（.xlsx）。以后发了答疑补遗，继续往这个项目里加就行。</div></div>`; return; }

  const tip=participates(f)?'点右侧出处按钮，原文上会标出位置':(f.note||(f.role==='drawing'?'图纸只列出，不参与解读':'不参与解读'));

  if(f.kind==='pdf') body=`<div class="pages">${f.pages.map((_,i)=>`<article class="pg" id="pg-${f.id}-${i+1}"><div class="pgno">第 ${i+1} 页</div><div class="sheet" style="aspect-ratio:${f.ratio}"><canvas></canvas><div class="hl"></div></div></article>`).join('')}</div>`;
  else if(f.kind==='docx') body=`<div class="paper" id="dv">${f.html}</div>`;
  else if(f.kind==='xlsx') body=`<div class="paper xlsx" id="dv">${(f.summary?.length?`<div class="okbox" style="margin-bottom:12px">${esc(summaryText(f))}</div>`:'')+f.sheets.map((sh,si)=>`<h4>表${si+1} · ${esc(sh.name)}</h4>`+xlsxTable(sh)).join('')}</div>`;

function xlsxTable(sh){
  const rows=sh.rows.slice(0,400); const w=Math.max(1,...rows.map(r=>r.length));
  const h=rows.findIndex(r=>r.filter(c=>typeof c==='string'&&c.trim()).length>=3);
  return '<div class="xwrap"><table><tr><td class="colh"></td>'+Array.from({length:w},(_,i)=>`<td class="colh">${String.fromCharCode(65+(i%26))}</td>`).join('')+'</tr>'+rows.map((r,ri)=>`<tr><td class="colh">${ri+1}</td>`+Array.from({length:w},(_,ci)=>{ const v=r[ci]; const s=fmtCell(v); return `<td class="${typeof v==='number'?'num':(s.length>18?'wrap':'')}${ri===h?' hd':''}">${esc(s)}</td>`; }).join('')+'</tr>').join('')+'</table></div>'+(sh.rows.length>400?`<div class="sub">仅显示前 400 行，共 ${sh.rows.length} 行</div>`:'');
}
function observePages(f){
  io?.disconnect();
  io=new IntersectionObserver(es=>{ for(const e of es) if(e.isIntersecting) drawPage(f,+e.target.id.split('-').pop()); },{root:$('#doc'),rootMargin:'900px 0px'});
  document.querySelectorAll('.pg').forEach(p=>io.observe(p));
}
async function drawPage(f,i){
  if(f.kind!=='pdf'||S.view!==f.id) return;
  const el=document.getElementById(`pg-${f.id}-${i}`); if(!el) return;
  const sheet=el.querySelector('.sheet'); const w=Math.round(sheet.clientWidth);
  if(!w || f.drawn.get(i)===w) return;
  f.drawn.set(i,w);
  try{
    const page=await f.pdf.getPage(i); if(S.view!==f.id) return;
    const v1=page.getViewport({scale:1}); const scale=w/v1.width;
    sheet.style.aspectRatio=`${v1.width}/${v1.height}`;
    f.vps[i]=page.getViewport({scale});
    const dpr=Math.min(window.devicePixelRatio||1,2); const vpd=page.getViewport({scale:scale*dpr});
    const c=sheet.querySelector('canvas');
    try{ f.tasks[i]?.cancel(); }catch(e){}
    c.width=Math.floor(vpd.width); c.height=Math.floor(vpd.height);
    const task=page.render({canvasContext:c.getContext('2d'),viewport:vpd,canvas:c}); f.tasks[i]=task;
    await task.promise;
  }catch(e){ if(e?.name!=='RenderingCancelledException') f.drawn.delete(i); }
  if(S.active?.file===f.id && S.active.page===i) paintHL();
}
function pdfRects(f,i,quote){
  const items=f.tc?.[i-1], vp=f.vps[i]; if(!items||!vp||!quote) return [];
  let st=''; const map=[];
  items.forEach((it,ii)=>{ const s=it.str; for(let ci=0;ci<s.length;ci++){ if(!WS.test(s[ci])){ st+=s[ci]; map.push([ii,ci]); } } });
  const q=strip(quote); let k=st.indexOf(q), len=q.length;
  if(k<0 && q.length>=10){ k=st.indexOf(q.slice(0,10)); len=10; }
  if(k<0) return [];
  const by=new Map();
  for(let j=k;j<k+len;j++){ const [ii,ci]=map[j]; const r=by.get(ii); if(!r) by.set(ii,[ci,ci]); else r[1]=ci; }
  const rects=[];
  for(const [ii,[a,b]] of by){
    const it=items[ii], n=it.str.length||1, t=it.transform, h=Math.hypot(t[2],t[3])||it.height||10;
    const x0=t[4]+it.width*(a/n), x1=t[4]+it.width*((b+1)/n), y0=t[5]-h*0.22, y1=t[5]+h*0.9;
    const m=vp.transform, ap=(x,y)=>[m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]];
    const p0=ap(x0,y0), p1=ap(x1,y1);
    rects.push({l:Math.min(p0[0],p1[0])-2,t:Math.min(p0[1],p1[1])-1,w:Math.abs(p1[0]-p0[0])+4,h:Math.abs(p1[1]-p0[1])+2});
  }
  rects.sort((p,q)=>p.t-q.t||p.l-q.l);
  const out=[];
  for(const r of rects){ const last=out[out.length-1];
    if(last && Math.abs(last.t-r.t)<Math.min(last.h,r.h)*0.5 && r.l<=last.l+last.w+r.h*0.8){ const right=Math.max(last.l+last.w,r.l+r.w), bottom=Math.max(last.t+last.h,r.t+r.h); last.l=Math.min(last.l,r.l); last.t=Math.min(last.t,r.t); last.w=right-last.l; last.h=bottom-last.t; }
    else out.push({...r}); }
  return out;
}
const QSEP='\u241e';  // 一个出处按钮可以带多段引文（材料清单按页分组时，同页各项一起标出）
function paintHL(){
  document.querySelectorAll('.hl').forEach(h=>h.innerHTML='');
  const a=S.active; const f=fileById(a?.file); if(!f||f.kind!=='pdf') return null;
  const layer=document.querySelector(`#pg-${f.id}-${a.page} .hl`); if(!layer) return null;
  let first=null;
  for(const q of String(a.quote||'').split(QSEP)) for(const r of pdfRects(f,a.page,q)){ const d=document.createElement('div'); d.className='hlbox'; d.style.cssText=`left:${r.l}px;top:${r.t}px;width:${r.w}px;height:${r.h}px`; layer.appendChild(d); first=first||d; }
  return first;
}
function highlightDom(root,quote){
  if(!root) return null;
  root.querySelectorAll('mark.qhl').forEach(m=>m.replaceWith(document.createTextNode(m.textContent))); root.normalize();
  let first=null;
  for(const q of String(quote||'').split(QSEP)) if(q) first=first||markQuote(root,q);
  return first;
}
function markQuote(root,quote){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let st=''; const map=[];
  while(tw.nextNode()){ const n=tw.currentNode, t=n.nodeValue; for(let i=0;i<t.length;i++){ if(!WS.test(t[i])){ st+=t[i]; map.push([n,i]); } } }
  // 表格的文字在解读时用“ | ”连接各单元格，原文里没有这个符号；整段找不到时再试开头、结尾各 10 个字
  const q=strip(quote).replace(/\|/g,''); let k=st.indexOf(q), len=q.length;
  if(k<0 && q.length>=10){ k=st.indexOf(q.slice(0,10)); len=10; }
  if(k<0 && q.length>=14){ k=st.indexOf(q.slice(-10)); len=10; }
  if(k<0) return null;
  const seg=new Map(); for(let j=k;j<k+len;j++){ const [n,i]=map[j]; const r=seg.get(n); if(!r) seg.set(n,[i,i]); else r[1]=i; }
  let first=null;
  for(const [n,[a,b]] of seg){ const r=document.createRange(); r.setStart(n,a); r.setEnd(n,b+1); const m=document.createElement('mark'); m.className='qhl'; r.surroundContents(m); first=first||m; }
  return first;
}
async function showCite(fileId,page,quote){
  const f=fileById(fileId); if(!f) return;
  if(S.view!==f.id){ S.view=f.id; renderDoc(); await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); }
  if(f.kind!=='pdf'){ const m=highlightDom($('#dv'),quote); if(m) m.scrollIntoView({block:'center',behavior:smooth()}); else toast('没有在原文中找到这段引文，请人工核对'); return; }
  // 页面元素可能还没渲染出来（刚切换文件时）：等一会儿再找，找不到要明确提示，不能没反应
  const el=document.getElementById(`pg-${f.id}-${page}`)||await waitFor(()=>document.getElementById(`pg-${f.id}-${page}`),3000);
  if(!el){ toast(`原文第 ${page} 页还没有加载出来，请稍后再点一次`); return; }
  S.active={file:f.id,page,quote};
  await drawPage(f,page);
  const box=paintHL();
  (box||el).scrollIntoView({block:box?'center':'start',behavior:smooth()});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  if(!box) toast('没有在这一页精确找到引文，已跳到该页，请人工核对');
}

function wasLine(changedFrom,cite){ return changedFrom?`<div class="was"><span class="chip amber sm">补遗已修改</span><span>原为：<s>${esc(changedFrom)}</s></span>${cite||''}</div>`:''; }
function countdown(){
  const el=$('#countdown'); const iso=S.res.overview?.deadline_iso; const t=iso?Date.parse(iso):NaN;
  if(!isFinite(t)){ el.innerHTML=''; return; }
  const ms=t-Date.now(); if(ms<=0){ el.className='countdown urgent'; el.innerHTML='<b>已截止</b>'; return; }
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), m=Math.floor(ms%36e5/6e4);
  el.className='countdown'+(ms<3*864e5?' urgent':'');
  el.innerHTML=`距投标截止 <b>${d>0?d+' 天 ':''}${h} 小时${d===0?' '+m+' 分':''}</b>`;
}
function wanAmount(s){ if(!s) return null; const m=String(s).match(/最高限价[^\d]{0,8}([\d,.]+)\s*(万)?/)||String(s).match(/([\d,.]+)\s*(万)?元/); if(!m) return null; const n=Number(m[1].replace(/,/g,'')); return isFinite(n)?n*(m[2]?1e4:1):null; }
function warnings(){
  const w=[]; const o=S.res.overview, sc=S.res.scoring;
  if(o){
    if(o.deadline_iso && !isFinite(Date.parse(o.deadline_iso))) w.push('投标截止时间没能识别成标准时间，倒计时未显示，请人工确认。');
    const miss=OV.filter(([k])=>OV_CORE.includes(k)&&!o.fields[k]?.value).map(([k,l])=>ovLabel(k,l));
    if(miss.length&&!o.pending) w.push(`有 ${miss.length} 项基本信息没有在资料中找到：${miss.join('、')}。`);
    const cap=wanAmount(ed('ov:budget',o.fields.budget?.value));
    for(const f of S.files.filter(f=>f.role==='list')) for(const s of f.summary||[]) for(const a of s.amounts){ if(!/限价|控制/.test(a.name)||!cap) continue; const v=a.total??a.sum; if(Math.abs(v-cap)>Math.max(1,cap*0.001)) w.push(`${f.name} 中「${a.name}」合计 ${money(v)}，与招标文件最高限价 ${money(cap)} 不一致，请核对。`); }
  }
  if(sc && sc.parts.length){
    const ps=sc.parts.reduce((a,p)=>a+(p.points||0),0);
    if(sc.total && Math.abs(ps-sc.total)>0.01) w.push(`评分各部分相加为 ${ps} 分，与总分 ${sc.total} 分不一致。`);
    for(const p of sc.parts){ const its=sc.items.filter(i=>i.part===p.name); if(!its.length||!p.points) continue; const s=its.reduce((a,i)=>a+Math.max(0,i.points||0),0); if(Math.abs(s-p.points)>0.01) w.push(`${p.name}分各评分项相加为 ${s} 分，与该部分 ${p.points} 分不一致，可能有遗漏。`); }
  }
  return w;
}
function stateBlock(mod,label){
  const st=S.status[mod];
  if(st==='loading') return `<div class="state"><span class="spin"></span><div>正在${label}，通常需要 20 到 90 秒</div></div>`;
  if(st==='error') return `<div class="state"><span class="chip amber">没有完成</span><div>${esc(S.err[mod])}</div>${S.aiOff?'':`<button class="btn sm" type="button" data-act="retry" data-mod="${mod}">重试</button>`}</div>`;
  if(S.aiOff||(aiChecked&&!sampleFn)) return `<div class="state"><div>当前环境没有连接模型，无法解读。</div></div>`;
  return `<div class="state"><div>还没有解读。</div><button class="btn sm" type="button" data-act="retry" data-mod="${mod}">开始解读</button></div>`;
}
function fileMeta(f){
  const bits=[];
  if(f.kind==='pdf') bits.push(`PDF · ${f.pages.length} 页`); else if(f.kind==='docx') bits.push(`${f.web?'网页':'Word'} · 约 ${f.chars.toLocaleString('zh-CN')} 字`); else if(f.kind==='xlsx') bits.push(`${f.ext==='csv'?'CSV':'Excel'} · ${f.sheets.length} 张表`); else bits.push(`.${esc(f.ext)}`);
  if(f.converted) bits.push(`<span class="chip plain sm">已从 .${esc(f.converted)} 转换</span>`);
  if(f.role==='amend') bits.push(`<span class="chip amber sm">第 ${f.order} 次${f.date?' · '+f.date:''}</span>`);
  if(f.kind==='xlsx'&&f.summary?.length) bits.push(esc(summaryText(f)));
  if(!participates(f)) bits.push(`<span class="chip plain sm">${esc(f.note||(f.role==='drawing'?'图纸，不参与解读':'不参与解读'))}</span>`);
  else if(f.note) bits.push(`<span class="chip amber sm">${esc(f.note)}</span>`);
  return bits.join('<span>·</span>');
}

function ovRow(k,l,f,p){

}

/* ---------- 复核 ----------

   程序给出“需人工核对”的理由：必核硬指标、出处没精确定位、标书留空或矛盾、评分合计对不上、AI 复核认为可能有误。

const whoAmI=()=>reviewer||'未署名';

const now=()=>new Date().toLocaleString('zh-CN',{hour12:false});

function scoreBadParts(){ const sc=S.res.scoring, bad=new Set(); if(!sc) return bad;
  for(const p of sc.parts){ const its=sc.items.filter(i=>i.part===p.name); if(!its.length||!p.points) continue; if(Math.abs(its.reduce((a,i)=>a+Math.max(0,i.points||0),0)-p.points)>0.01) bad.add(p.name); } return bad; }

    const nm=String(x.name||'').split(' · ').pop(); if(nm.length>=2&&(S.res.scoring?.insight?.corrections||[]).some(c=>c.text.includes(nm))) F.push('AI 复核认为可能有误'); }
  if(x&&(x.quote||x.file)&&!x.manual){ const r=resolve(x); if(!r||!r.ok) F.push('出处未精确定位'); }

const needsRv=(key,x)=>rvState(key)==='todo'&&flagsOf(key,x).length>0;
const rvHide=(key,x)=>S.rvOnly&&!needsRv(key,x);
function rvCtl(key,x,{del=true,confirm=true}={}){ if(roHere()) return '';

function labelOf(key){ const [m,a,b]=key.split(':');

function outlineBlocks(){

  if(a==='trash-purge'){ const tid=t.dataset.tid, it=(P.trash||[]).find(x=>x.trashId===tid);
    uiDialog({title:`彻底删除“${it?.name||''}”？`,body:'项目里的文件和解读结果会被永久删除，无法恢复。',ok:'彻底删除',danger:true}).then(y=>{ if(y) PJ.trash.purge(tid).then(()=>{ toast('已彻底删除'); loadTrash(); }).catch(e=>toast('删除失败：'+(e?.message||e))); }); return; }
  if(a==='rerun-ask'){ uiDialog({title:'重新解读这个项目？',body:'会用全部资料重新跑一遍五个模块，大约 1 到 3 分钟。人工修改和复核记录会保留；条目顺序变化时，个别修改可能需要重新确认。',ok:'重新解读'}).then(y=>{ if(y) rerunNow(); }); return; }
  if(a==='pren' && S.pid) renameProject(S.pid);
  if(a==='add') pick_('add');
  if(a==='retry'){ if(!S.ctl||S.ctl.signal.aborted) S.ctl=new AbortController(); runMod(t.dataset.mod,true); }
  if(a==='rerun'){ rerunNow(); }
  if(a==='stop') abortAll();
  if(a==='outline') exportOutline();
  if(a==='csv') exportCsv();
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-check]');
  if(c){ const k=c.dataset.check; if(c.checked) S.checks[k]=true; else delete S.checks[k];
    if(k.startsWith('rk:')&&c.checked&&!reviewer){ delete S.checks[k]; c.checked=false; needWho(); return; }
    if(k.startsWith('rk:')){ if(c.checked){ S.rv[k]={s:'ok',by:whoAmI(),at:now()}; logRv(k,'确认无误'); } else if(S.rv[k]?.s==='ok'){ delete S.rv[k]; logRv(k,'撤销确认'); } }
    persist(); render(); return; }
  const wsel=e.target.closest('[data-rvwho]'); if(wsel){ if(wsel.value==='__new'){ S.rvNameEdit=true; render(); setTimeout(()=>$('#rvNewName')?.focus(),0); } else if(wsel.value){ setWho(wsel.value); render(); } return; }
  const r=e.target.closest('[data-role]');
  if(r){ const f=fileById(r.dataset.role); if(!f) return; f.role=r.value; orderAmends(); S.stale=true; citeCache.clear(); persist(); renderDoc(); render(); }
});
document.addEventListener('dblclick',e=>{ const el=e.target.closest('[data-edit]'); if(!el||el.isContentEditable||roHere()) return;
  el.setAttribute('contenteditable','plaintext-only'); el.focus();
  const r=document.createRange(); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); });
document.addEventListener('focusout',e=>{
  const el=e.target.closest?.('[data-edit]'); if(!el) return;
  const key=el.dataset.edit; const v=el.textContent.trim(); const orig=origOf(key);
  const before=ed(key,orig);
  if(!v||v===orig) delete S.edits[key]; else S.edits[key]=v;
  if(v&&v!==before&&!key.startsWith('td:role')) logRv(key,'修改',before,v);
  if(!key.startsWith('td:role')) el.removeAttribute('contenteditable');
  persist(); setTimeout(render,0);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='addText'){ e.preventDefault(); addItem(S.adding,e.target.value); return; }
  if(e.key==='Enter'&&e.target.id==='rvNewName'){ e.preventDefault(); const v=e.target.value.trim(); if(v){ setWho(v); S.rvNameEdit=false; render(); } return; }
  if(e.key==='Escape'&&e.target.id==='addText'){ S.adding=null; render(); return; } });
document.addEventListener('keydown',e=>{ const el=e.target.closest?.('[data-edit]'); if(el&&e.key==='Enter'){ e.preventDefault(); el.blur(); } if(el&&e.key==='Escape'){ el.textContent=ed(el.dataset.edit,origOf(el.dataset.edit))||''; el.blur(); } });
function origOf(key){ const [m,a,b]=key.split(':');
  if(m==='rk'&&b?.startsWith('a')) return S.added['rk:'+a]?.[+b.slice(1)]?.text;
  if(m==='mt'&&a?.startsWith('a')) return S.added.mt?.[+a.slice(1)]?.name;
  if(m==='ov') return S.res.overview?.fields[a]?.value||'未在资料中找到，请人工确认';
  if(m==='rk') return S.res.risks?.[a]?.[+b]?.text;
  if(m==='sc') return S.res.scoring?.items[+a]?.tip||'—';
  if(m==='mt'){ const mm=materialsModel(), o=[...mm.forms,...mm.others].find(o=>o.key===key); return o?mtName(o):S.res.materials?.items[+a]?.name; } }
document.addEventListener('submit',e=>{ if(e.target.id==='askForm'){ e.preventDefault(); const i=$('#askInput'); const q=i.value; i.value=''; ask(q); } });
$('#newBtn').onclick=()=>pick_('new');
$('#reportBtn').onclick=exportReport;
$('#fileInput').onchange=e=>{ const fl=e.target.files; if(fl?.length) fromInput(fl, pickMode==='add'); e.target.value=''; };
let dragN=0;
const appendMode=()=>PJ?!!(S.pid&&!S.sample&&!roHere()):(S.files.length&&!S.sample);
$('#pjToggle').onclick=()=>{ P.open=!P.open; try{ localStorage.setItem('bidread3:pjOpen',P.open?'1':'0'); }catch(e){} renderProjects(); };
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='pname' && e.target.dataset.act==='pren') renameProject(S.pid); });
window.addEventListener('dragenter',e=>{ if(![...(e.dataTransfer?.types||[])].includes('Files')) return; e.preventDefault(); dragN++; $('#dropText').innerHTML=appendMode()?'松开鼠标，<b>添加到当前项目</b><br><span class="sub">新的答疑补遗会自动覆盖旧内容并重新解读。要换一个项目，请点“打开招标资料”。</span>':'松开鼠标，打开这套招标资料<br><span class="sub">可以一次拖入多个文件或 zip 包：PDF、Word（.docx）、Excel（.xlsx）</span>'; $('#drop').hidden=false; });
window.addEventListener('dragover',e=>{ if([...(e.dataTransfer?.types||[])].includes('Files')) e.preventDefault(); });
window.addEventListener('dragleave',()=>{ dragN=Math.max(0,dragN-1); if(!dragN) $('#drop').hidden=true; });
window.addEventListener('drop',e=>{ e.preventDefault(); dragN=0; $('#drop').hidden=true; const fl=e.dataTransfer?.files; if(fl?.length) fromInput(fl, appendMode()); });
setInterval(countdown,60000);

/* ---------- boot ---------- */
try{ new ResizeObserver(onDocResize).observe($('#doc')); }catch(e){}
if(PJ){
  renderProjects();
  refreshProjects().then(()=>{ let last=''; try{ last=localStorage.getItem('bidread3:lastProject')||''; }catch(e){}
    if(P.list.length && !RO) showHome(); else { const p=last==='__sample'?null:(P.list.find(x=>x.id===last)||P.list[0]); if(p) openProject(p.id); else loadSample(); } });
}else loadSample();
(async()=>{
  try{ if(window.claude?.use){ const [s,d]=await Promise.all([claude.use('sample'),claude.use('downloads')]); sampleFn=s; dl=d; } }catch(e){}
  /* 宿主适配：在 claude.ai 之外（如 dsh desktop、本地开发）通过 window.BIDREAD_ADAPTER 注入模型调用和文件保存 */
  const AD=window.BIDREAD_ADAPTER;
  if(!sampleFn && AD?.sample?.json) sampleFn=AD.sample;
  if(!dl && AD?.downloads?.save) dl=AD.downloads;
  if(AD?.model) refreshModel();
  aiChecked=true; render();
})();
</script>
</body></html>
